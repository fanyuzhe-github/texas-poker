<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0"
    />
    <meta
      name="description"
      content="德州扑克牌桌记分、分账、段位与勋章"
    />
    <link
      rel="icon"
      href="<%= BASE_URL %>favicon.ico"
    />

    <!--
      「添加到主屏幕」用的声明（**不含 Service Worker**，所以离线并不能用）：
      手机上从桌面图标打开时没有地址栏，牌桌上少一层干扰。
      manifest 里全用相对路径，配合 publicPath: "./"，在 GitHub Pages 的子路径下也认。
    -->
    <link
      rel="manifest"
      href="<%= BASE_URL %>manifest.json"
    />
    <meta
      name="theme-color"
      content="#111c31"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <!-- iOS 不读 manifest 的 display，只认这几个私有 meta 才肯全屏启动 -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="扑克结算"
    />
    <!--
      status-bar-style 必须是 black 而不是 black-translucent：
      后者会让网页顶到状态栏底下，需要配合 safe-area 内边距，否则标题会被时间盖住。
    -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black"
    />
    <link
      rel="apple-touch-icon"
      href="<%= BASE_URL %>apple-touch-icon.png"
    />

    <title>德州扑克结算系统</title>
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without
        JavaScript enabled. Please enable it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
